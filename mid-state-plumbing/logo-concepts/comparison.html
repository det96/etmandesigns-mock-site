<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mid-State Plumbing logo concepts</title>
  <style>
    :root {
      --navy: #1a4a61;
      --orange: #e85d04;
      --paper: #f4f7f8;
      --ink: #1a1208;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--navy);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    .sheet {
      width: 1440px;
      margin: 0 auto;
      padding: 36px 40px 28px;
    }
    .kicker {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 6px 0 22px;
      font-size: 36px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .row {
      display: grid;
      grid-template-columns: 168px 1fr 1fr 112px;
      gap: 14px;
      align-items: stretch;
      margin: 0 0 14px;
    }
    .label {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8px 4px 8px 0;
    }
    .label .id {
      margin: 0;
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .label h2 {
      margin: 4px 0 0;
      font-size: 26px;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 168px;
      padding: 16px 18px;
    }
    .panel.light {
      background: #fff;
    }
    .panel.navy {
      background: var(--navy);
    }
    .panel img {
      width: 100%;
      height: auto;
      display: block;
    }
    .icon-cell {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-cell img {
      width: 84px;
      height: 84px;
      display: block;
    }
    .note {
      margin: 18px 0 0;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="kicker">Mid-State Plumbing, Inc.</p>
    <h1>Four logo directions</h1>

    <section class="row">
      <div class="label">
        <p class="id">Concept A</p>
        <h2>State Line</h2>
      </div>
      <div class="panel light"><img src="a-state-line/logo-light.png" alt="Concept A on white"></div>
      <div class="panel navy"><img src="a-state-line/logo-navy.png" alt="Concept A on navy"></div>
      <div class="icon-cell"><img src="a-state-line/icon.png" alt="Concept A icon"></div>
    </section>

    <section class="row">
      <div class="label">
        <p class="id">Concept B</p>
        <h2>Schematic</h2>
      </div>
      <div class="panel light"><img src="b-schematic/logo-light.png" alt="Concept B on white"></div>
      <div class="panel navy"><img src="b-schematic/logo-navy.png" alt="Concept B on navy"></div>
      <div class="icon-cell"><img src="b-schematic/icon.png" alt="Concept B icon"></div>
    </section>

    <section class="row">
      <div class="label">
        <p class="id">Concept C</p>
        <h2>Monogram</h2>
      </div>
      <div class="panel light"><img src="c-monogram/logo-light.png" alt="Concept C on white"></div>
      <div class="panel navy"><img src="c-monogram/logo-navy.png" alt="Concept C on navy"></div>
      <div class="icon-cell"><img src="c-monogram/icon.png" alt="Concept C icon"></div>
    </section>

    <section class="row">
      <div class="label">
        <p class="id">Concept D</p>
        <h2>Field Badge</h2>
      </div>
      <div class="panel light"><img src="d-field-badge/logo-light.png" alt="Concept D on white"></div>
      <div class="panel navy"><img src="d-field-badge/logo-navy.png" alt="Concept D on navy"></div>
      <div class="icon-cell"><img src="d-field-badge/icon.png" alt="Concept D icon"></div>
    </section>

    <p class="note">Logo concepts by EtmanDesigns</p>
  </div>
</body>
</html>
